# Zip-deploys the packaged app (a folder containing server.js) to a slot of
# the Linux Web App, then waits until /api/health answers. Sets the output
# variable deployApp.AppServiceApplicationUrl.
parameters:
  - name: package
    type: string
  - name: slot
    type: string
  - name: apiBaseUrl
    type: string

steps:
  - task: AzureWebApp@1
    name: deployApp
    displayName: Deploy to slot ${{ parameters.slot }}
    inputs:
      azureSubscription: ${{ variables.armServiceConnection }}
      appType: webAppLinux
      appName: $(webAppName)
      deployToSlotOrASE: true
      resourceGroupName: $(resourceGroup)
      slotName: ${{ parameters.slot }}
      package: ${{ parameters.package }}
      runtimeStack: NODE|24-lts
      startUpCommand: node server.js
      # The package is already built: App Service must not run its own build.
      appSettings: >-
        -API_BASE_URL ${{ parameters.apiBaseUrl }}
        -HOSTNAME 0.0.0.0
        -SCM_DO_BUILD_DURING_DEPLOYMENT false

  - template: wait-for-health.yml
    parameters:
      url: $(deployApp.AppServiceApplicationUrl)
