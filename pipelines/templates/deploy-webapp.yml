# Deploys the image to a Web App slot and waits until /api/health answers.
# Sets the output variable deployContainer.AppServiceApplicationUrl.
parameters:
  - name: webImage
    type: string
  - name: slot
    type: string
  - name: apiBaseUrl
    type: string

steps:
  - task: AzureWebAppContainer@1
    name: deployContainer
    displayName: Deploy image to slot ${{ parameters.slot }}
    inputs:
      azureSubscription: ${{ variables.armServiceConnection }}
      appName: $(webAppName)
      deployToSlotOrASE: true
      resourceGroupName: $(resourceGroup)
      slotName: ${{ parameters.slot }}
      containers: ${{ parameters.webImage }}
      appSettings: >-
        -API_BASE_URL ${{ parameters.apiBaseUrl }}
        -WEBSITES_PORT 3000
        -WEBSITES_ENABLE_APP_SERVICE_STORAGE false

  - script: |
      url="$(deployContainer.AppServiceApplicationUrl)"
      for attempt in $(seq 1 60); do
        code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/health" || true)
        if [ "$code" = "200" ]; then
          echo "$url is healthy"
          exit 0
        fi
        echo "Attempt $attempt: /api/health returned $code; retrying in 10s"
        sleep 10
      done
      echo "##vso[task.logissue type=error]$url/api/health did not return 200 within 10 minutes"
      exit 1
    displayName: Wait for /api/health
