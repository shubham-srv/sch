# Starts docker-compose.e2e.yml with the image under test, runs the given
# steps against it, then always prints logs and tears the stack down.
parameters:
  - name: webImage
    type: string
  - name: projectName
    type: string
  - name: webHostPort
    type: string
    default: "3000"
  - name: mockApiHostPort
    type: string
    default: "4010"
  - name: steps
    type: stepList
    default: []

steps:
  - task: Docker@2
    displayName: Log in to ACR
    inputs:
      command: login
      containerRegistry: ${{ variables.acrServiceConnection }}

  - script: docker compose -f docker-compose.e2e.yml up -d --build --wait
    displayName: Start E2E stack
    env:
      WEB_IMAGE: ${{ parameters.webImage }}
      COMPOSE_PROJECT_NAME: ${{ parameters.projectName }}
      WEB_HOST_PORT: ${{ parameters.webHostPort }}
      MOCK_API_HOST_PORT: ${{ parameters.mockApiHostPort }}

  - ${{ each step in parameters.steps }}:
      - ${{ step }}

  - script: |
      docker compose -f docker-compose.e2e.yml logs --no-color
      docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
    displayName: Stack logs and teardown
    condition: always()
    env:
      WEB_IMAGE: ${{ parameters.webImage }}
      COMPOSE_PROJECT_NAME: ${{ parameters.projectName }}
      WEB_HOST_PORT: ${{ parameters.webHostPort }}
      MOCK_API_HOST_PORT: ${{ parameters.mockApiHostPort }}
