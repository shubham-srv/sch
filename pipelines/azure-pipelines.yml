# Frontend CI/CD (docs/deployment-azure.md).
#
# CI runs on pushes to main. Azure Repos Git ignores the YAML `pr:` trigger,
# so pull requests are validated by a Build validation branch policy on main
# that runs this same pipeline; the deploy stages skip PR runs.

trigger:
  branches:
    include:
      - main

parameters:
  - name: deployToProduction
    displayName: Swap staging into production (needs environment approval)
    type: boolean
    default: false
  - name: agentPool
    displayName: Self-hosted Linux agent pool
    type: string
    default: "<agent-pool>" # TODO(owner)

variables:
  # Service connection names must be known when the pipeline is compiled
  # (resource authorization), which variable groups are not, so they live
  # here. See docs/decisions.md.
  - name: acrServiceConnection
    value: "<acr-service-connection>" # TODO(owner)
  - name: armServiceConnection
    value: "<arm-service-connection>" # TODO(owner)
  # TODO(owner): create this variable group; keys are listed in
  # docs/deployment-azure.md (acrName, resourceGroup, webAppName,
  # stagingSlot, stagingApiBaseUrl, smokeExpectedGreeting).
  - group: web-frontend
  - name: imageRepository
    value: web
  - name: webImage
    value: $(acrName).azurecr.io/$(imageRepository):$(Build.BuildId)
  - name: CI
    value: "true"
  - name: HUSKY
    value: "0"
  - name: DOCKER_BUILDKIT
    value: "1"

pool:
  name: ${{ parameters.agentPool }}

stages:
  - stage: Validate
    jobs:
      - job: Validate
        steps:
          - checkout: self
          - template: templates/setup-node-pnpm.yml

          - script: pnpm format:check
            displayName: Prettier
          - script: pnpm lint
            displayName: ESLint
          - script: pnpm typecheck
            displayName: TypeScript

          - script: |
              pnpm api:types
              git diff --exit-code -- src/lib/api/generated
              test -z "$(git status --porcelain -- src/lib/api/generated)"
            displayName: API contract drift check

          - script: pnpm test:cov
            displayName: Unit, component and integration tests

          - task: PublishTestResults@2
            displayName: Publish Vitest results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/junit/vitest.xml
              testRunTitle: Vitest
          - task: PublishCodeCoverageResults@2
            displayName: Publish coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: coverage/cobertura-coverage.xml

  - stage: Build
    dependsOn: Validate
    jobs:
      - job: Image
        steps:
          - checkout: self
          # Separate build and push: buildAndPush ignores `arguments`.
          - task: Docker@2
            displayName: Build image
            inputs:
              command: build
              containerRegistry: ${{ variables.acrServiceConnection }}
              repository: $(imageRepository)
              Dockerfile: $(Build.SourcesDirectory)/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              tags: |
                $(Build.BuildId)
                $(Build.SourceVersion)
              arguments: >-
                --build-arg BUILD_ID=$(Build.BuildId)
                --build-arg COMMIT_SHA=$(Build.SourceVersion)
          - task: Docker@2
            displayName: Push image to ACR
            inputs:
              command: push
              containerRegistry: ${{ variables.acrServiceConnection }}
              repository: $(imageRepository)
              tags: |
                $(Build.BuildId)
                $(Build.SourceVersion)

  - stage: E2E
    dependsOn: Build
    jobs:
      - job: Playwright
        steps:
          - checkout: self
          - template: templates/setup-node-pnpm.yml
            parameters:
              installPlaywrightChromium: true
          - template: templates/e2e-stack.yml
            parameters:
              webImage: $(webImage)
              projectName: web-e2e-$(Build.BuildId)-e2e
              webHostPort: "3000"
              mockApiHostPort: "4010"
              steps:
                - script: pnpm test:e2e
                  displayName: Playwright
                  env:
                    PLAYWRIGHT_BASE_URL: http://localhost:3000

          - task: PublishTestResults@2
            displayName: Publish Playwright results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/junit/playwright.xml
              testRunTitle: Playwright E2E
          - task: PublishPipelineArtifact@1
            displayName: Publish Playwright report
            condition: always()
            inputs:
              targetPath: playwright-report
              artifact: playwright-report-$(System.JobAttempt)
          - task: PublishPipelineArtifact@1
            displayName: Publish traces and videos
            condition: always()
            inputs:
              targetPath: test-results
              artifact: playwright-traces-$(System.JobAttempt)

  - stage: Accessibility
    dependsOn: Build
    jobs:
      - job: Pa11y
        steps:
          - checkout: self
          - template: templates/setup-node-pnpm.yml
            parameters:
              installPlaywrightChromium: true
          # Different host ports from E2E: both stages may share an agent host.
          - template: templates/e2e-stack.yml
            parameters:
              webImage: $(webImage)
              projectName: web-e2e-$(Build.BuildId)-a11y
              webHostPort: "3001"
              mockApiHostPort: "4011"
              steps:
                - script: pnpm a11y:ci
                  displayName: pa11y-ci
                  env:
                    A11Y_BASE_URL: http://localhost:3001

          - task: PublishPipelineArtifact@1
            displayName: Publish a11y report
            condition: always()
            inputs:
              targetPath: reports/a11y.json
              artifact: a11y-report-$(System.JobAttempt)

  - stage: Deploy_Staging
    dependsOn:
      - E2E
      - Accessibility
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: Staging
        environment: web-staging # TODO(owner): create the environment
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/deploy-webapp.yml
                  parameters:
                    webImage: $(webImage)
                    slot: $(stagingSlot)
                    apiBaseUrl: $(stagingApiBaseUrl)
                - template: templates/setup-node-pnpm.yml
                  parameters:
                    installPlaywrightChromium: true
                - script: pnpm test:e2e --grep @smoke
                  displayName: Smoke tests against staging
                  env:
                    PLAYWRIGHT_BASE_URL: $(deployContainer.AppServiceApplicationUrl)
                    SMOKE_EXPECTED_GREETING: $(smokeExpectedGreeting)
                - task: PublishTestResults@2
                  displayName: Publish smoke results
                  condition: always()
                  inputs:
                    testResultsFormat: JUnit
                    testResultsFiles: reports/junit/playwright.xml
                    testRunTitle: Staging smoke
                - task: PublishPipelineArtifact@1
                  displayName: Publish smoke report
                  condition: always()
                  inputs:
                    targetPath: playwright-report
                    artifact: smoke-report-$(System.JobAttempt)

  - stage: Deploy_Production
    dependsOn: Deploy_Staging
    condition: >-
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq('${{ parameters.deployToProduction }}', 'true')
      )
    jobs:
      - deployment: Production
        # Approval check is configured on this environment in Azure DevOps.
        environment: web-production # TODO(owner): create it and add an approval check
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - task: AzureAppServiceManage@0
                  displayName: Swap staging into production
                  inputs:
                    azureSubscription: ${{ variables.armServiceConnection }}
                    Action: Swap Slots
                    WebAppName: $(webAppName)
                    ResourceGroupName: $(resourceGroup)
                    SourceSlot: $(stagingSlot)
                    SwapWithProduction: true
