# Frontend CI/CD (docs/deployment-azure.md).
#
# CI runs on pushes to main. Azure Repos Git ignores the YAML `pr:` trigger,
# so pull requests are validated by a Build validation branch policy on main
# that runs this same pipeline; the deploy stages skip PR runs.
#
# The app is built once (dist/app), tested as built against a real backend,
# stored in Azure Artifacts as a Universal Package, and that package is what
# gets deployed. Nightly checks live in nightly-e2e.yml.

trigger:
  branches:
    include:
      - main

parameters:
  - name: deployToProduction
    displayName: Swap staging into production (needs environment approval)
    type: boolean
    default: false
  - name: agentPool
    displayName: Self-hosted Linux agent pool
    type: string
    default: "<agent-pool>" # TODO(owner)

variables:
  # Service connection names must be known when the pipeline is compiled
  # (resource authorization), which variable groups are not, so it lives
  # here. See docs/decisions.md.
  - name: armServiceConnection
    value: "<arm-service-connection>" # TODO(owner)
  # Default for an optional variable-group key: empty means "only check that
  # the greeting is not empty".
  - name: expectedGreeting
    value: ""
  # TODO(owner): create this variable group; keys are listed in
  # docs/deployment-azure.md.
  - group: web-frontend
  - name: packageName
    value: web
  # Universal Package version. Bump the 0.1 prefix for a new release line.
  - name: packageVersion
    value: 0.1.$(Build.BuildId)
  - name: CI
    value: "true"
  - name: HUSKY
    value: "0"

pool:
  name: ${{ parameters.agentPool }}

stages:
  - stage: Validate
    jobs:
      - job: Validate
        steps:
          - checkout: self
          - template: templates/setup-node-yarn.yml

          - script: yarn format:check
            displayName: Prettier
          - script: yarn lint
            displayName: ESLint
          - script: yarn typecheck
            displayName: TypeScript
          - script: yarn test:cov
            displayName: Unit, component and integration tests

          - task: PublishTestResults@2
            displayName: Publish Vitest results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/junit/vitest.xml
              testRunTitle: Vitest
          - task: PublishCodeCoverageResults@2
            displayName: Publish coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: coverage/cobertura-coverage.xml

  - stage: Build
    dependsOn: Validate
    jobs:
      - job: Package
        steps:
          - checkout: self
          - template: templates/setup-node-yarn.yml
          # next build + scripts/package-app.mjs -> dist/app
          - script: yarn build
            displayName: Build and package the app
          # For the test stages of this run.
          - task: PublishPipelineArtifact@1
            displayName: Publish app as pipeline artifact
            inputs:
              targetPath: dist/app
              artifact: app
          # The deployable record of this build. PR builds are not published.
          - task: UniversalPackages@0
            displayName: Publish app to Azure Artifacts
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              command: publish
              publishDirectory: dist/app
              feedsToUsePublish: internal
              vstsFeedPublish: $(artifactsFeed)
              vstsFeedPackagePublish: $(packageName)
              versionOption: custom
              versionPublish: $(packageVersion)
              packagePublishDescription: web $(Build.SourceVersion)

  - stage: E2E
    dependsOn: Build
    jobs:
      - job: Playwright
        steps:
          - checkout: self
          - template: templates/setup-node-yarn.yml
            parameters:
              installPlaywrightChromium: true
          - download: current
            artifact: app
          - template: templates/serve-app.yml
            parameters:
              appDirectory: $(Pipeline.Workspace)/app
              apiBaseUrl: $(stagingApiBaseUrl)
              port: "3000"
              steps:
                - script: yarn test:e2e
                  displayName: Playwright against the packaged app
                  env:
                    PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
                    E2E_EXPECTED_GREETING: $(expectedGreeting)
          - template: templates/publish-playwright.yml
            parameters:
              title: Playwright E2E
              artifactPrefix: playwright

  - stage: Accessibility
    dependsOn: Build
    jobs:
      - job: Pa11y
        steps:
          - checkout: self
          - template: templates/setup-node-yarn.yml
            parameters:
              installPlaywrightChromium: true
          - download: current
            artifact: app
          # A different port from E2E: both stages may share an agent host.
          - template: templates/serve-app.yml
            parameters:
              appDirectory: $(Pipeline.Workspace)/app
              apiBaseUrl: $(stagingApiBaseUrl)
              port: "3001"
              steps:
                - script: yarn a11y:ci
                  displayName: pa11y-ci
                  env:
                    A11Y_BASE_URL: http://127.0.0.1:3001
          - task: PublishPipelineArtifact@1
            displayName: Publish a11y report
            condition: always()
            inputs:
              targetPath: reports/a11y.json
              artifact: a11y-report-$(System.JobAttempt)

  - stage: Deploy_Staging
    dependsOn:
      - E2E
      - Accessibility
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: Staging
        environment: web-staging # TODO(owner): create the environment
        strategy:
          runOnce:
            deploy:
              steps:
                # Deploy what was stored in Azure Artifacts, not the
                # pipeline artifact.
                - download: none
                - checkout: self
                - task: UniversalPackages@0
                  displayName: Download app from Azure Artifacts
                  inputs:
                    command: download
                    downloadDirectory: $(Pipeline.Workspace)/release
                    feedsToUse: internal
                    vstsFeed: $(artifactsFeed)
                    vstsFeedPackage: $(packageName)
                    vstsPackageVersion: $(packageVersion)
                - template: templates/deploy-webapp.yml
                  parameters:
                    package: $(Pipeline.Workspace)/release
                    slot: $(stagingSlot)
                    apiBaseUrl: $(stagingApiBaseUrl)
                - template: templates/setup-node-yarn.yml
                  parameters:
                    installPlaywrightChromium: true
                - script: yarn test:e2e
                  displayName: Playwright against staging
                  env:
                    PLAYWRIGHT_BASE_URL: $(deployApp.AppServiceApplicationUrl)
                    E2E_EXPECTED_GREETING: $(expectedGreeting)
                - template: templates/publish-playwright.yml
                  parameters:
                    title: Staging E2E
                    artifactPrefix: staging

  - stage: Deploy_Production
    dependsOn: Deploy_Staging
    condition: >-
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq('${{ parameters.deployToProduction }}', 'true')
      )
    jobs:
      - deployment: Production
        # Approval check is configured on this environment in Azure DevOps.
        environment: web-production # TODO(owner): create it and add an approval check
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self
                - task: AzureAppServiceManage@0
                  displayName: Swap staging into production
                  inputs:
                    azureSubscription: ${{ variables.armServiceConnection }}
                    Action: Swap Slots
                    WebAppName: $(webAppName)
                    ResourceGroupName: $(resourceGroup)
                    SourceSlot: $(stagingSlot)
                    SwapWithProduction: true
                - template: templates/wait-for-health.yml
                  parameters:
                    url: $(productionUrl)
                - template: templates/setup-node-yarn.yml
                  parameters:
                    installPlaywrightChromium: true
                # Production gets only the read-only @smoke tests.
                - script: yarn test:e2e --grep @smoke
                  displayName: Smoke tests against production
                  env:
                    PLAYWRIGHT_BASE_URL: $(productionUrl)
                    E2E_EXPECTED_GREETING: $(expectedGreeting)
                - template: templates/publish-playwright.yml
                  parameters:
                    title: Production smoke
                    artifactPrefix: production
