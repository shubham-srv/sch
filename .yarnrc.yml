# A flat node_modules of real folders (like npm's) instead of Yarn's default
# Plug'n'Play, which Turbopack does not support. The Next.js standalone output
# copies node_modules, and a zip deployment to App Service needs real folders.
# ESLint's import/no-extraneous-dependencies rule replaces the strictness this
# gives up.
nodeLinker: node-modules

# Install scripts of dependencies never run (Yarn's default since 4.14, stated
# here so it holds on any version). Scripts reviewed and found unnecessary are
# listed under "dependenciesMeta" in package.json: puppeteer's would download
# Chrome (pa11y-ci uses Playwright's Chromium, see .pa11yci.js), and
# unrs-resolver ships its native binary as an optional dependency. Any other
# package with an install script shows up as a warning during install.
enableScripts: false

# Package versions published less than a day ago are not installed, so a
# hijacked release is usually caught and pulled before it reaches this project.
npmMinimalAgeGate: 1d

# Don't send usage data to the Yarn team.
enableTelemetry: false
